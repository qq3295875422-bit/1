name: Qifu Temporary Cinnamon Desktop

on:
  push:
    paths:
      - '.github/workflows/qifu-temp-cinnamon.yml'

permissions:
  contents: write

concurrency:
  group: qifu-temp-cinnamon-desktop
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cinnamon Chinese desktop
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .devcontainer/install-desktop.sh .devcontainer/start-desktop.sh
          bash .devcontainer/install-desktop.sh

      - name: Configure one password and disable lock
        shell: bash
        run: |
          set -euo pipefail
          DESKTOP_PASSWORD="$(python3 - <<'PY'
          import secrets, string
          alphabet = string.ascii_lowercase + string.digits
          print(''.join(secrets.choice(alphabet) for _ in range(8)))
          PY
          )"
          printf '%s' "$DESKTOP_PASSWORD" > /tmp/desktop-password.txt
          VNC_PASSWD_BIN="$(command -v tigervncpasswd || command -v vncpasswd)"
          printf '%s\n' "$DESKTOP_PASSWORD" | "$VNC_PASSWD_BIN" -f > "$HOME/.vnc/passwd"
          chmod 600 "$HOME/.vnc/passwd"
          printf '%s:%s\n' "$USER" "$DESKTOP_PASSWORD" | sudo chpasswd
          dbus-run-session -- gsettings set org.cinnamon.desktop.screensaver lock-enabled false || true
          dbus-run-session -- gsettings set org.cinnamon.desktop.session idle-delay 0 || true
          dbus-run-session -- gsettings set org.cinnamon.settings-daemon.plugins.power sleep-display-ac 0 || true
          dbus-run-session -- gsettings set org.cinnamon.settings-daemon.plugins.power sleep-display-battery 0 || true
          dbus-run-session -- gsettings set org.cinnamon.settings-daemon.plugins.power idle-dim false || true

      - name: Start Cinnamon and noVNC
        shell: bash
        run: |
          set -euo pipefail
          bash .devcontainer/start-desktop.sh
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:6902/vnc.html >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:6902/vnc.html >/dev/null
          pgrep -fa 'cinnamon|muffin|Xvnc'

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate --protocol http2 \
            --url http://127.0.0.1:6902 >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          TUNNEL_URL=''
          for i in $(seq 1 90); do
            TUNNEL_URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done
          [ -n "$TUNNEL_URL" ] || { cat /tmp/cloudflared.log >&2; exit 1; }
          for i in $(seq 1 30); do
            if curl -fsSI "$TUNNEL_URL/vnc.html" >/dev/null 2>&1; then
              printf '%s' "$TUNNEL_URL" >/tmp/tunnel-url.txt
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cloudflared.log >&2 || true
          exit 1

      - name: Publish encrypted access state
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/qifu-public.pem <<'EOF'
-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAp+VUmn1JlWEwRERbvWrZ
3DMDr45VuAJo3Coxx4PPsDbTpCTx/zfVnG913JIyGmjscuV2n4xOkPIode1kJZgN
oqtOvWxTt8H9m1lSM66+MjKrdaNJPTUABz46ycquUlYIYfpC6lHuIBlvuDL1Ng1C
SgthCuNViYi57Y7GEwPgJ4q3yEYX9zEmgb4P7mWyqiyXAhKIRI1syOc9rXwF5b0/
MFS/ZaQhQSdZysNufrxs6bCNVpO6tfcNnw05xQe+DxKIPMYlErAfavxk31VV1BMr
cxpnXsJL3lSlkJseXrg/EZo7ZKviNNu8vHDsCegKj4rkRw7rnhXGcWbCKeygOK8J
RQIDAQAB
-----END PUBLIC KEY-----
EOF
          ENC_PASSWORD="$(openssl pkeyutl -encrypt -pubin -inkey /tmp/qifu-public.pem -in /tmp/desktop-password.txt | base64 -w0)"
          TUNNEL_URL="$(cat /tmp/tunnel-url.txt)"
          python3 - "$TUNNEL_URL" "$ENC_PASSWORD" "$GITHUB_RUN_ID" <<'PY'
          import json, sys, datetime
          url, enc, run_id = sys.argv[1:4]
          state = {
            "ready": True,
            "url": url + "/vnc.html?autoconnect=true&resize=scale&quality=6&compression=5",
            "root_url": url + "/",
            "password_enc": enc,
            "run_id": run_id,
            "desktop": "Cinnamon",
            "locale": "zh_CN.UTF-8",
            "input_method": "Fcitx5-Pinyin",
            "lock_disabled": True,
            "published_at": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open(".qifu-temp-desktop-state.json","w").write(json.dumps(state, ensure_ascii=False, indent=2)+"\n")
          PY
          git config user.name "qifu-cloud-desktop"
          git config user.email "qifu-cloud-desktop@users.noreply.github.com"
          git add .qifu-temp-desktop-state.json
          git commit -m "Publish temporary desktop state [skip ci]"
          git push origin HEAD:main

      - name: Keep desktop online
        shell: bash
        run: |
          set -euo pipefail
          echo 'Temporary Cinnamon desktop is online.'
          for i in $(seq 1 300); do
            pgrep -F /tmp/cloudflared.pid >/dev/null || exit 1
            pgrep -f 'websockify.*6902' >/dev/null || exit 1
            pgrep -fa 'cinnamon|muffin|Xvnc' >/dev/null || exit 1
            sleep 60
          done
