name: Temporary Cinnamon noVNC Sandbox

on:
  push:
    paths:
      - '.github/workflows/cinnamon-novnc.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DISPLAY: ':99'

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install Cinnamon, Chinese environment and desktop tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cinnamon-core cinnamon-l10n \
            xvfb x11vnc novnc websockify dbus-x11 \
            locales language-pack-zh-hans fonts-noto-cjk \
            fcitx5 fcitx5-chinese-addons \
            libreoffice gnome-terminal git curl wget unzip zip psmisc x11-utils imagemagick
          sudo locale-gen zh_CN.UTF-8
          sudo update-locale LANG=zh_CN.UTF-8

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Cinnamon desktop and noVNC
        shell: bash
        run: |
          set -euo pipefail
          export LANG=zh_CN.UTF-8
          export LC_ALL=zh_CN.UTF-8
          export LANGUAGE=zh_CN:zh
          export XMODIFIERS='@im=fcitx'
          export GTK_IM_MODULE=fcitx
          export QT_IM_MODULE=fcitx
          export LIBGL_ALWAYS_SOFTWARE=1
          export CINNAMON_SOFTWARE_RENDERING=1

          mkdir -p "$HOME/.vnc" "$HOME/.config/autostart"
          VNC_PASSWORD="$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 12)"
          printf '%s' "$VNC_PASSWORD" > /tmp/vnc-password.txt
          x11vnc -storepasswd "$VNC_PASSWORD" "$HOME/.vnc/passwd" >/dev/null
          chmod 600 "$HOME/.vnc/passwd"

          nohup Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset \
            >/tmp/xvfb.log 2>&1 &
          sleep 2

          dbus-run-session -- bash -lc '
            export DISPLAY=:99
            export LANG=zh_CN.UTF-8
            export LC_ALL=zh_CN.UTF-8
            export LANGUAGE=zh_CN:zh
            export XMODIFIERS="@im=fcitx"
            export GTK_IM_MODULE=fcitx
            export QT_IM_MODULE=fcitx
            export LIBGL_ALWAYS_SOFTWARE=1
            export CINNAMON_SOFTWARE_RENDERING=1
            fcitx5 -d --replace >/tmp/fcitx5.log 2>&1 || true
            if command -v cinnamon-session-cinnamon2d >/dev/null 2>&1; then
              exec cinnamon-session-cinnamon2d
            else
              exec cinnamon-session
            fi
          ' >/tmp/cinnamon-session.log 2>&1 &

          sleep 10
          if ! pgrep -fa 'cinnamon|muffin' >/tmp/cinnamon-processes.txt; then
            echo 'Cinnamon session did not stay running.' >&2
            cat /tmp/cinnamon-session.log >&2 || true
            exit 1
          fi

          nohup x11vnc -display :99 -rfbport 5901 -forever -shared \
            -rfbauth "$HOME/.vnc/passwd" -capslock \
            >/tmp/x11vnc.log 2>&1 &

          NOVNC_WEB='/usr/share/novnc'
          test -f "$NOVNC_WEB/vnc.html"
          nohup websockify --web="$NOVNC_WEB" 6080 localhost:5901 \
            >/tmp/websockify.log 2>&1 &
          sleep 3
          curl -fsSI http://127.0.0.1:6080/vnc.html >/dev/null

      - name: Start public Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          nohup cloudflared tunnel --no-autoupdate --protocol http2 \
            --url http://127.0.0.1:6080 \
            >/tmp/cloudflared.log 2>&1 &

          TUNNEL_URL=''
          for i in $(seq 1 90); do
            TUNNEL_URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo 'Quick Tunnel URL was not created.' >&2
            cat /tmp/cloudflared.log >&2 || true
            exit 1
          fi

          VNC_PASSWORD="$(cat /tmp/vnc-password.txt)"
          {
            printf 'URL=%s/vnc.html?autoconnect=true&resize=scale\n' "$TUNNEL_URL"
            printf 'PASSWORD=%s\n' "$VNC_PASSWORD"
            printf 'LOCALE=zh_CN.UTF-8\n'
            printf 'DESKTOP=Cinnamon\n'
            printf 'EXPIRES_WHEN_ACTION_STOPS=true\n'
          } > /tmp/connection.txt

          curl -fsSI "$TUNNEL_URL/vnc.html" >/dev/null

      - name: Upload private-ish connection artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinnamon-novnc-connection
          path: /tmp/connection.txt
          retention-days: 1

      - name: Keep desktop online
        shell: bash
        run: |
          set -euo pipefail
          echo 'Desktop is online; connection details are stored in the workflow artifact.'
          for i in $(seq 1 330); do
            pgrep -f 'cloudflared tunnel' >/dev/null || exit 1
            pgrep -f 'websockify.*6080' >/dev/null || exit 1
            pgrep -f 'x11vnc.*5901' >/dev/null || exit 1
            sleep 60
          done
