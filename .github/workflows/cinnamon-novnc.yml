name: Temporary Cinnamon noVNC Sandbox

on:
  push:
    paths:
      - '.github/workflows/cinnamon-novnc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install verified Cinnamon Chinese desktop stack
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .devcontainer/install-desktop.sh .devcontainer/start-desktop.sh
          bash .devcontainer/install-desktop.sh

      - name: Create private VNC password
        shell: bash
        run: |
          set -euo pipefail
          VNC_PASSWORD="$(python3 - <<'PY'
          import secrets, string
          alphabet = string.ascii_letters + string.digits
          print(''.join(secrets.choice(alphabet) for _ in range(8)))
          PY
          )"
          printf '%s' "$VNC_PASSWORD" > /tmp/vnc-password.txt
          VNC_PASSWD_BIN="$(command -v tigervncpasswd || command -v vncpasswd)"
          printf '%s\n' "$VNC_PASSWORD" | "$VNC_PASSWD_BIN" -f > "$HOME/.vnc/passwd"
          chmod 600 "$HOME/.vnc/passwd"

      - name: Start Cinnamon and noVNC
        shell: bash
        run: |
          set -euo pipefail
          bash .devcontainer/start-desktop.sh
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:6902/vnc.html >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:6902/vnc.html >/dev/null
          pgrep -fa 'cinnamon|muffin|Xvnc' > /tmp/desktop-processes.txt
          cat /tmp/desktop-processes.txt

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Publish noVNC through Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          nohup cloudflared tunnel --no-autoupdate --protocol http2 \
            --url http://127.0.0.1:6902 \
            >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid

          TUNNEL_URL=''
          for i in $(seq 1 90); do
            TUNNEL_URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done
          if [ -z "$TUNNEL_URL" ]; then
            cat /tmp/cloudflared.log >&2 || true
            exit 1
          fi

          VNC_PASSWORD="$(cat /tmp/vnc-password.txt)"
          {
            printf 'URL=%s/vnc.html?autoconnect=true&resize=scale&quality=6&compression=5\n' "$TUNNEL_URL"
            printf 'ROOT_URL=%s/\n' "$TUNNEL_URL"
            printf 'PASSWORD=%s\n' "$VNC_PASSWORD"
            printf 'DESKTOP=Cinnamon\n'
            printf 'LOCALE=zh_CN.UTF-8\n'
            printf 'INPUT_METHOD=Fcitx5-Pinyin\n'
          } > /tmp/connection.txt

          for i in $(seq 1 30); do
            curl -fsSI "$TUNNEL_URL/vnc.html" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/cloudflared.log >&2 || true
          exit 1

      - name: Upload connection details
        uses: actions/upload-artifact@v4
        with:
          name: cinnamon-novnc-connection
          path: /tmp/connection.txt
          retention-days: 1

      - name: Keep desktop online
        shell: bash
        run: |
          set -euo pipefail
          echo 'Cinnamon noVNC desktop is online.'
          for i in $(seq 1 300); do
            pgrep -F /tmp/cloudflared.pid >/dev/null || exit 1
            pgrep -f 'websockify.*6902' >/dev/null || exit 1
            pgrep -fa 'cinnamon|muffin|Xvnc' >/dev/null || exit 1
            sleep 60
          done

