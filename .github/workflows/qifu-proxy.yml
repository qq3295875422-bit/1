name: qifu-proxy-node-fixed

on:
  push:
    branches:
      - qifu-proxy-20260810-1841

permissions:
  contents: write

jobs:
  proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout isolated proxy branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Xray and tunnel tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y curl jq unzip openssl openssh-client

          XRAY_URL="$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r '.assets[] | select(.name=="Xray-linux-64.zip") | .browser_download_url' | head -n1)"
          test -n "$XRAY_URL"
          curl -fsSL "$XRAY_URL" -o /tmp/xray.zip
          mkdir -p /tmp/xray
          unzip -q /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray

          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

      - name: Start private VLESS WebSocket node
        shell: bash
        run: |
          set -euo pipefail
          UUID="$(cat /proc/sys/kernel/random/uuid)"
          WSPATH="qifu-$(openssl rand -hex 10)"
          printf '%s' "$UUID" > /tmp/qifu-proxy-uuid
          printf '%s' "$WSPATH" > /tmp/qifu-proxy-path

          cat >/tmp/xray-config.json <<EOF
          {
            "log": {"loglevel": "warning"},
            "inbounds": [
              {
                "listen": "127.0.0.1",
                "port": 8080,
                "protocol": "vless",
                "settings": {
                  "clients": [{"id": "$UUID"}],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": {"path": "/$WSPATH"}
                }
              }
            ],
            "outbounds": [
              {"protocol": "freedom", "tag": "direct"},
              {"protocol": "blackhole", "tag": "blocked"}
            ]
          }
          EOF

          nohup /tmp/xray/xray run -config /tmp/xray-config.json >/tmp/xray.log 2>&1 &
          echo $! >/tmp/xray.pid
          for i in $(seq 1 30); do
            ss -ltn | grep -q ':8080 ' && break
            sleep 1
          done
          ss -ltn | grep -q ':8080 '

      - name: Open Pinggy HTTPS tunnel
        shell: bash
        run: |
          set -euo pipefail
          nohup ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            -T -p 443 -R0:127.0.0.1:8080 free.pinggy.io \
            >/tmp/pinggy.log 2>&1 &
          echo $! >/tmp/pinggy.pid

          PINGGY_URL=''
          for i in $(seq 1 90); do
            PINGGY_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.(pinggy\.link|pinggy-free\.link)' /tmp/pinggy.log | head -n1 || true)"
            [ -n "$PINGGY_URL" ] && break
            sleep 2
          done
          if [ -z "$PINGGY_URL" ]; then
            cat /tmp/pinggy.log
            exit 1
          fi
          echo "$PINGGY_URL" >/tmp/pinggy-url
          PINGGY_HOST="${PINGGY_URL#https://}"

          # Verify the public endpoint really presents a usable TLS certificate.
          for i in $(seq 1 20); do
            if echo | openssl s_client -connect "${PINGGY_HOST}:443" -servername "$PINGGY_HOST" 2>/dev/null | grep -q 'Verify return code: 0'; then
              break
            fi
            sleep 2
          done
          echo | openssl s_client -connect "${PINGGY_HOST}:443" -servername "$PINGGY_HOST" 2>/dev/null | grep -q 'Verify return code: 0'

      - name: Open Cloudflare backup tunnel
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid

          CF_URL=''
          for i in $(seq 1 90); do
            CF_URL="$(grep -Eo 'https://[A-Za-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
            [ -n "$CF_URL" ] && break
            sleep 2
          done
          test -n "$CF_URL"
          echo "$CF_URL" >/tmp/cf-url

      - name: Publish encrypted tested access state
        shell: bash
        run: |
          set -euo pipefail
          PINGGY_HOST="$(sed 's#https://##' /tmp/pinggy-url)"
          CF_HOST="$(sed 's#https://##' /tmp/cf-url)"
          UUID="$(cat /tmp/qifu-proxy-uuid)"
          WSPATH="$(cat /tmp/qifu-proxy-path)"
          printf '%s|%s|%s|%s|%s' "$PINGGY_HOST" "$CF_HOST" "$UUID" "$WSPATH" "$GITHUB_RUN_ID" >/tmp/qifu-proxy-state.txt

          cat >/tmp/qifu-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA2rODiIPYQ3GrsT8FPPiM
          5xwTiFPDZxUgdND47Crr1dnNyz9WSN1exWAqw989FQuhZNZ6+x+L++nNlMGvI5tV
          JWCEdYHBhb/c/8ENCLpvjKGfXQHjyuoWKbOf6IsEmx2nS2Sh9XPdccllfqiO+2zM
          sgz3m229OUMzEkYPoiVujgqYheZyowZN/7iwSODORLvoxmhf2ivw26LQNe/S4XEd
          VhFkjjd87OGEJvYirJeRuzaq51zWYjNG0TdfIPMEfZYtLtkkYAVB/aPA6WmOWF0j
          Liy4k0TcJSb4O1DKlgfiS/bZAhx66Rq3EG3xWOI63LJZhpyHpnwx+6Y26MR1MIe6
          zQIDAQAB
          -----END PUBLIC KEY-----
          EOF

          openssl pkeyutl -encrypt -pubin -inkey /tmp/qifu-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/qifu-proxy-state.txt -out /tmp/qifu-proxy-state.enc
          base64 -w0 /tmp/qifu-proxy-state.enc > proxy-status-v2.enc

          git config user.name 'qifu-proxy-bot'
          git config user.email 'qifu-proxy-bot@users.noreply.github.com'
          git add proxy-status-v2.enc
          git commit -m '[skip ci] publish repaired proxy access state'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Keep repaired proxy online
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 66); do
            kill -0 "$(cat /tmp/xray.pid)"
            kill -0 "$(cat /tmp/pinggy.pid)"
            kill -0 "$(cat /tmp/cloudflared.pid)"
            ss -ltn | grep -q ':8080 '
            sleep 300
          done
