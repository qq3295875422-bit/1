name: qifu-russia-proxy

on:
  push:
    branches:
      - qifu-russia-proxy-20260810

permissions:
  contents: write

jobs:
  proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout isolated Russia proxy branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install proxy and VPN tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y curl jq unzip openssl openssh-client openvpn iproute2 iptables python3
          XRAY_URL="$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r '.assets[] | select(.name=="Xray-linux-64.zip") | .browser_download_url' | head -n1)"
          curl -fsSL "$XRAY_URL" -o /tmp/xray.zip
          mkdir -p /tmp/xray
          unzip -q /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

      - name: Build isolated Russia network namespace
        shell: bash
        run: |
          set -euo pipefail
          sudo ip netns add runs
          sudo ip link add veth-host type veth peer name veth-ru
          sudo ip link set veth-ru netns runs
          sudo ip addr add 10.210.0.1/24 dev veth-host
          sudo ip link set veth-host up
          sudo ip netns exec runs ip addr add 10.210.0.2/24 dev veth-ru
          sudo ip netns exec runs ip link set lo up
          sudo ip netns exec runs ip link set veth-ru up
          sudo ip netns exec runs ip route add default via 10.210.0.1
          HOST_IF="$(ip route show default | awk '/default/ {print $5; exit}')"
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -t nat -A POSTROUTING -s 10.210.0.0/24 -o "$HOST_IF" -j MASQUERADE
          sudo iptables -A FORWARD -i veth-host -o "$HOST_IF" -j ACCEPT
          sudo iptables -A FORWARD -i "$HOST_IF" -o veth-host -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          sudo mkdir -p /etc/netns/runs
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/runs/resolv.conf >/dev/null

      - name: Find and verify a working Russia VPN Gate exit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv
          mkdir -p /tmp/ru_candidates
          python3 - <<'PY'
          import base64, csv, re, os
          rows=[]
          with open('/tmp/vpngate.csv', encoding='utf-8', errors='replace') as f:
              for line in f:
                  if line.startswith('*') or line.startswith('#') or not line.strip():
                      continue
                  try: row=next(csv.reader([line]))
                  except Exception: continue
                  if len(row) < 15 or row[6] != 'RU' or not row[14]:
                      continue
                  try:
                      cfg=base64.b64decode(row[14]).decode('utf-8',errors='replace')
                  except Exception:
                      continue
                  ip=row[1]
                  cfg=re.sub(r'(?m)^remote\s+\S+\s+(\d+)(.*)$',lambda m:f'remote {ip} {m.group(1)}{m.group(2)}',cfg)
                  tcp=1 if re.search(r'(?mi)^proto\s+tcp', cfg) else 0
                  try: score=int(row[2]); ping=int(row[3] or 999999); speed=int(row[4])
                  except Exception: score=0; ping=999999; speed=0
                  rows.append((tcp,score,speed,-ping,row,cfg))
          if not rows:
              raise SystemExit('No Russia OpenVPN candidates available')
          rows.sort(key=lambda x:(x[0],x[1],x[2],x[3]), reverse=True)
          with open('/tmp/ru_candidates/index.tsv','w') as idx:
              for i,(_,_,_,_,row,cfg) in enumerate(rows[:12]):
                  open(f'/tmp/ru_candidates/{i}.ovpn','w').write(cfg)
                  idx.write(f'{i}\t{row[0]}\t{row[1]}\n')
          print('Russia candidates prepared:', min(12,len(rows)))
          PY

          printf 'vpn\nvpn\n' >/tmp/vpn.auth
          chmod 600 /tmp/vpn.auth
          SUCCESS=0
          while IFS=$'\t' read -r IDX NAME IP; do
            echo "Trying Russia VPN candidate #$IDX: $NAME $IP"
            LOG="/tmp/openvpn-ru-$IDX.log"
            PID="/tmp/openvpn-ru-$IDX.pid"
            sudo rm -f "$LOG" "$PID"
            sudo ip netns exec runs ip link del tun0 2>/dev/null || true
            sudo ip netns exec runs openvpn \
              --config "/tmp/ru_candidates/$IDX.ovpn" \
              --auth-user-pass /tmp/vpn.auth \
              --connect-retry-max 1 \
              --daemon --writepid "$PID" --log "$LOG" || true

            CONNECTED=0
            for i in $(seq 1 12); do
              if sudo ip netns exec runs ip link show tun0 >/dev/null 2>&1 && sudo grep -q 'Initialization Sequence Completed' "$LOG" 2>/dev/null; then
                CONNECTED=1
                break
              fi
              sleep 2
            done

            if [ "$CONNECTED" = 1 ]; then
              EGRESS_IP="$(sudo ip netns exec runs curl -fsS --max-time 15 https://api.ipify.org || true)"
              COUNTRY=''
              for U in https://ipapi.co/country/ https://ipinfo.io/country https://ifconfig.co/country-iso; do
                COUNTRY="$(sudo ip netns exec runs curl -fsS --max-time 12 "$U" 2>/dev/null | tr -d '\r\n ' | head -c2 || true)"
                [ "$COUNTRY" = 'RU' ] && break
              done
              echo "Candidate result: egress=$EGRESS_IP country=$COUNTRY"
              if [ "$COUNTRY" = 'RU' ]; then
                printf '%s' "$EGRESS_IP" >/tmp/ru-egress-ip
                printf '%s' "$COUNTRY" >/tmp/ru-country
                printf '%s|%s' "$NAME" "$IP" >/tmp/ru-vpn-server
                SUCCESS=1
                break
              fi
            fi

            if sudo test -s "$PID"; then sudo kill "$(sudo cat "$PID")" 2>/dev/null || true; fi
            sleep 1
          done </tmp/ru_candidates/index.tsv

          test "$SUCCESS" = 1
          echo "VERIFIED_RUSSIA_EGRESS=$(cat /tmp/ru-egress-ip) COUNTRY=$(cat /tmp/ru-country) VPN=$(cat /tmp/ru-vpn-server)"

      - name: Start VLESS inside Russia namespace
        shell: bash
        run: |
          set -euo pipefail
          UUID="$(cat /proc/sys/kernel/random/uuid)"
          WSPATH="qifu-ru-$(openssl rand -hex 10)"
          printf '%s' "$UUID" >/tmp/qifu-proxy-uuid
          printf '%s' "$WSPATH" >/tmp/qifu-proxy-path
          cat >/tmp/xray-config.json <<EOF
          {"log":{"loglevel":"warning"},"inbounds":[{"listen":"0.0.0.0","port":8080,"protocol":"vless","settings":{"clients":[{"id":"$UUID"}],"decryption":"none"},"streamSettings":{"network":"ws","wsSettings":{"path":"/$WSPATH"}}}],"outbounds":[{"protocol":"freedom","tag":"direct"},{"protocol":"blackhole","tag":"blocked"}]}
          EOF
          sudo ip netns exec runs sh -c 'nohup /tmp/xray/xray run -config /tmp/xray-config.json >/tmp/xray-ru.log 2>&1 & echo $! >/tmp/xray-ru.pid'
          for i in $(seq 1 30); do sudo ip netns exec runs ss -ltn | grep -q ':8080 ' && break; sleep 1; done
          sudo ip netns exec runs ss -ltn | grep -q ':8080 '

      - name: Open HTTPS ingress tunnels
        shell: bash
        run: |
          set -euo pipefail
          nohup ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes -T -p 443 -R0:10.210.0.2:8080 free.pinggy.io >/tmp/pinggy-ru.log 2>&1 &
          echo $! >/tmp/pinggy-ru.pid
          PINGGY_URL=''
          for i in $(seq 1 90); do PINGGY_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.(pinggy\.link|pinggy-free\.link)' /tmp/pinggy-ru.log | head -n1 || true)"; [ -n "$PINGGY_URL" ] && break; sleep 2; done
          test -n "$PINGGY_URL"
          echo "$PINGGY_URL" >/tmp/pinggy-ru-url

          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://10.210.0.2:8080 >/tmp/cloudflared-ru.log 2>&1 &
          echo $! >/tmp/cloudflared-ru.pid
          CF_URL=''
          for i in $(seq 1 90); do CF_URL="$(grep -Eo 'https://[A-Za-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared-ru.log | head -n1 || true)"; [ -n "$CF_URL" ] && break; sleep 2; done
          test -n "$CF_URL"
          echo "$CF_URL" >/tmp/cf-ru-url

          PINGGY_HOST="${PINGGY_URL#https://}"
          echo | openssl s_client -connect "${PINGGY_HOST}:443" -servername "$PINGGY_HOST" 2>/dev/null | grep -q 'Verify return code: 0'

      - name: Publish encrypted Russia node state
        shell: bash
        run: |
          set -euo pipefail
          PINGGY_HOST="$(sed 's#https://##' /tmp/pinggy-ru-url)"
          CF_HOST="$(sed 's#https://##' /tmp/cf-ru-url)"
          UUID="$(cat /tmp/qifu-proxy-uuid)"
          WSPATH="$(cat /tmp/qifu-proxy-path)"
          EGRESS_IP="$(cat /tmp/ru-egress-ip)"
          COUNTRY="$(cat /tmp/ru-country)"
          VPN_SERVER="$(cat /tmp/ru-vpn-server)"
          printf '%s|%s|%s|%s|%s|%s|%s|%s' "$PINGGY_HOST" "$CF_HOST" "$UUID" "$WSPATH" "$GITHUB_RUN_ID" "$EGRESS_IP" "$COUNTRY" "$VPN_SERVER" >/tmp/qifu-ru-state.txt
          cat >/tmp/qifu-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAsKFOhk75I3jdTPHm9/qB
          6y20WYcX86aUdW+6p34JPhgka3XxkisG3RNR78BoFRCy0uK31jfy12GeLJuqBDGt
          DNdMCS09azsKKTyed850Kyo95DwXCItmt4gGIUsH6purd7hKDbWeYvRDYDQ0kFzO
          x8wHr+cInUxxDadqoscGTUBqXJULW187sJRU91zP2XRd8zyatdxZSKAbdMD8t6OI
          QgJWPJ0Uo6rd4tghD/J4q5pCR40tyks466p2WQ3YxThRNAXrYyXSRKGs33w4lZSb
          ryG89JqvylajSkcGyAhXbBAFDG/prssN5z1AzBXoV3nXmJ/ldCZYm7U1X9iFRucS
          vc4GvhYWWX6IO7IAuPUMUk+KfB8qyRYnA0OMwfxHICV/cm8VrlvY2P1JUbpJdRA3
          d9GDol10GmAxqweko+rlvWR1BiNzXPjw8bKDgAo4CRtPIAYMwJKABee5gTK1BsSz
          vqOteRBxQceD58x4wWPdlutPCfcDTQMgkM4iIla0klDj0wrtuEZSoCC2qTDh3Gd4
          +gfRi5XWkMNO6pas3gdybMyLzKhbWd5ODZY855xy2QMXKCfDNk1AnuuHiCg0GbUx
          0vxeq4FdaIkUhgwDef7DU/TUifuOwbbl5JcvUz3SIlU+/kO6uPstnohFRYNEYDd9
          aYd3+Eo+8H6JrAUIlZ9iwUcCAwEAAQ==
          -----END PUBLIC KEY-----
          EOF
          openssl pkeyutl -encrypt -pubin -inkey /tmp/qifu-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/qifu-ru-state.txt -out /tmp/qifu-ru-state.enc
          base64 -w0 /tmp/qifu-ru-state.enc > russia-proxy-status.enc
          git config user.name 'qifu-russia-proxy-bot'
          git config user.email 'qifu-russia-proxy-bot@users.noreply.github.com'
          git add russia-proxy-status.enc
          git commit -m '[skip ci] publish verified Russia proxy state'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Keep verified Russia proxy online
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 66); do
            sudo ip netns exec runs ip link show tun0 >/dev/null
            sudo ip netns exec runs ss -ltn | grep -q ':8080 '
            kill -0 "$(cat /tmp/cloudflared-ru.pid)"
            sleep 300
          done
