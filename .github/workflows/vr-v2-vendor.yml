name: VR V2 Static Release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Download fixed project payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          url='https://drive.usercontent.google.com/download?id=1GCSCx2FVWKLQ9Qu0iymSMcNmmMm2gVGq&export=download&confirm=t'
          curl --fail --location --retry 1 --retry-delay 2 --connect-timeout 20 --max-time 120 "$url" -o work/payload.zip
          echo '56316f0e5928e6e51d054c0538df93cef868750f1c0f05d656bb60dfe2124c13  work/payload.zip' | sha256sum -c -
          unzip -q work/payload.zip -d work
          test -f work/release/index.html
          test -f work/source/tests/dynamic-browser-test.mjs

      - name: Fetch fixed official Three.js r180
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch r180 https://github.com/mrdoob/three.js.git work/three-r180
          test "$(node -p "require('./work/three-r180/package.json').version")" = '0.180.0'

      - name: Assemble local vendor files
        shell: bash
        run: |
          set -euo pipefail
          for root in work/release/assets/js/vendor/three work/source/vendor/three; do
            mkdir -p "$root/addons/controls" "$root/addons/webxr"
            cp work/three-r180/build/three.module.min.js "$root/three.module.min.js"
            cp work/three-r180/build/three.core.min.js "$root/three.core.min.js"
            cp work/three-r180/examples/jsm/controls/OrbitControls.js "$root/addons/controls/OrbitControls.js"
            cp work/three-r180/examples/jsm/controls/TransformControls.js "$root/addons/controls/TransformControls.js"
            cp work/three-r180/examples/jsm/webxr/VRButton.js "$root/addons/webxr/VRButton.js"
            cp work/three-r180/LICENSE "$root/LICENSE"
            cp work/three-r180/package.json "$root/package.json"
          done
          test "$(node -p "require('./work/release/assets/js/vendor/three/package.json').version")" = '0.180.0'
          grep -q 'from"./three.core.min.js"' work/release/assets/js/vendor/three/three.module.min.js
          ! grep -RIl '<!DOCTYPE html' work/release/assets/js/vendor/three
          find work/release/assets/js/vendor/three -type f -size +0c | sort
          sha256sum $(find work/release/assets/js/vendor/three -type f | sort) > work/three-vendor-sha256.txt

      - name: Run specialized logic tests
        shell: bash
        working-directory: work/source
        run: |
          set -euo pipefail
          node --experimental-loader ./tests/three-loader.mjs ./tests/run-tests.mjs
          node -e "const r=require('./validation/specialized-tests.json'); if(!r.passed || r.ikRandomCases < 10000 || r.assertions < 30062) process.exit(1)"

      - name: Validate static structure and module paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, sys
          root=pathlib.Path('work/release')
          required=[
            'qifu-vr.json','index.html','assets/js','assets/css','assets/models','assets/images','assets/audio',
            'assets/js/app/main.js','assets/css/main.css',
            'assets/js/vendor/three/three.module.min.js','assets/js/vendor/three/three.core.min.js',
            'assets/js/vendor/three/addons/controls/OrbitControls.js',
            'assets/js/vendor/three/addons/controls/TransformControls.js',
            'assets/js/vendor/three/addons/webxr/VRButton.js',
            'assets/js/vendor/three/LICENSE','assets/js/vendor/three/package.json'
          ]
          missing=[p for p in required if not (root/p).exists()]
          if missing: raise SystemExit('missing: '+repr(missing))
          manifest=json.loads((root/'qifu-vr.json').read_text())
          assert manifest['id']=='vr-storyboard-stage'
          assert manifest['version']=='2.0.0'
          assert manifest['entry']=='index.html'
          assert manifest['offline'] is True
          html=(root/'index.html').read_text()
          assert './assets/js/vendor/three/three.module.min.js' in html
          assert './assets/js/vendor/three/addons/' in html
          assert './assets/js/app/main.js' in html
          assert './assets/css/main.css' in html
          app_files=[root/'index.html',root/'qifu-vr.json',*list((root/'assets/js/app').rglob('*.js')),*list((root/'assets/css').rglob('*.css'))]
          forbidden=[r'https?://',r'localhost',r'127\.0\.0\.1',r'(?<!\.)/assets/',r'/src/',r'qifu-static-sdk',r'static-sdk',r'QifuSDK',r'VRSDK',r'SDK\.init',r'sdkVersion',r'sdkPath']
          hits=[]
          for f in app_files:
            text=f.read_text(errors='ignore')
            for pat in forbidden:
              if re.search(pat,text,re.I): hits.append((str(f),pat))
          if hits: raise SystemExit('forbidden runtime references: '+repr(hits))
          unresolved=[]
          for f in (root/'assets/js/app').rglob('*.js'):
            text=f.read_text()
            for spec in re.findall(r'(?:from\s*|import\s*)[\"\']([^\"\']+)[\"\']',text):
              if spec=='three' or spec.startswith('three/addons/'): continue
              if spec.startswith('.'):
                target=(f.parent/spec).resolve()
                if not target.exists(): unresolved.append((str(f),spec))
          if unresolved: raise SystemExit('unresolved modules: '+repr(unresolved))
          pathlib.Path('work/validation').mkdir(exist_ok=True)
          (pathlib.Path('work/validation')/'module-path-check.json').write_text(json.dumps({'passed':True,'required':required,'unresolved':[],'forbiddenHits':[]},ensure_ascii=False,indent=2))
          PY

      - name: HTTP endpoint checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory work/release > work/http-server.log 2>&1 &
          echo $! > work/http-server.pid
          trap 'kill $(cat work/http-server.pid) 2>/dev/null || true' EXIT
          sleep 2
          python3 - <<'PY'
          import json, urllib.request, pathlib
          paths=['/','/index.html','/qifu-vr.json','/assets/js/app/main.js','/assets/css/main.css','/assets/js/vendor/three/three.module.min.js','/assets/js/vendor/three/three.core.min.js','/assets/js/vendor/three/addons/controls/OrbitControls.js','/assets/js/vendor/three/addons/controls/TransformControls.js','/assets/js/vendor/three/addons/webxr/VRButton.js']
          results=[]
          for p in paths:
            with urllib.request.urlopen('http://127.0.0.1:4173'+p,timeout=20) as r:
              status=r.status; r.read(128)
            results.append({'path':p,'status':status})
            assert status==200
          pathlib.Path('work/validation').mkdir(exist_ok=True)
          pathlib.Path('work/validation/http-results.json').write_text(json.dumps({'passed':True,'results':results},indent=2))
          PY

      - name: Real Chrome dynamic test
        shell: bash
        run: |
          set -euo pipefail
          if ! kill -0 "$(cat work/http-server.pid)" 2>/dev/null; then
            python3 -m http.server 4173 --directory work/release > work/http-server.log 2>&1 &
            echo $! > work/http-server.pid
            sleep 2
          fi
          mkdir -p work/validation
          export VR_V2_BASE_URL='http://127.0.0.1:4173/'
          export VR_V2_BROWSER_RESULT="$PWD/work/validation/browser-dynamic.json"
          if node -e "process.exit(typeof WebSocket==='function'?0:1)"; then
            node work/source/tests/dynamic-browser-test.mjs
          else
            node --experimental-websocket work/source/tests/dynamic-browser-test.mjs
          fi
          kill "$(cat work/http-server.pid)" 2>/dev/null || true
          node -e "const r=require('./work/validation/browser-dynamic.json');if(!r.passed)process.exit(1)"

      - name: Build formal packages and reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/output work/reports
          cp work/source/validation/specialized-tests.json work/validation/specialized-tests.json
          cp work/three-vendor-sha256.txt work/reports/ThreeJS-r180-SHA256.txt
          (cd work/release && zip -qr ../output/vr-storyboard-stage-v2.qifuvr.zip .)
          cp -R work/validation work/source/validation-final
          cp -R work/reports work/source/reports-final
          (cd work && zip -qr output/vr-storyboard-stage-v2-source.zip source)
          unzip -Z1 work/output/vr-storyboard-stage-v2.qifuvr.zip > work/reports/ZIP内容清单.txt
          find work/release -type f | sed 's#work/release/##' | sort > work/reports/正式包文件清单.txt
          find work/source -type f | sed 's#work/source/##' | sort > work/reports/源码文件清单.txt
          python3 - <<'PY'
          import hashlib,json,pathlib,datetime,subprocess
          release=pathlib.Path('work/release'); out=pathlib.Path('work/output'); reports=pathlib.Path('work/reports')
          runtime=out/'vr-storyboard-stage-v2.qifuvr.zip'; source=out/'vr-storyboard-stage-v2-source.zip'
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          files=[p for p in release.rglob('*') if p.is_file()]
          js=[p for p in files if p.suffix=='.js']; css=[p for p in files if p.suffix=='.css']
          browser=json.loads(pathlib.Path('work/validation/browser-dynamic.json').read_text())
          specialized=json.loads(pathlib.Path('work/validation/specialized-tests.json').read_text())
          http=json.loads(pathlib.Path('work/validation/http-results.json').read_text())
          module=json.loads(pathlib.Path('work/validation/module-path-check.json').read_text())
          vendor_pkg=json.loads((release/'assets/js/vendor/three/package.json').read_text())
          metadata={
            'runtimeZip':'vr-storyboard-stage-v2.qifuvr.zip','runtimeSha256':sha(runtime),'runtimeBytes':runtime.stat().st_size,
            'sourceZip':'vr-storyboard-stage-v2-source.zip','sourceSha256':sha(source),'sourceBytes':source.stat().st_size,
            'fileCount':len(files),'javascriptFileCount':len(js),'cssFileCount':len(css),'threeVersion':vendor_pkg['version'],
            'browserDynamicPassed':browser['passed'],'browserAssertions':browser.get('assertions'),
            'specializedAssertions':specialized['assertions'],'ikRandomCases':specialized['ikRandomCases'],
            'httpPassed':http['passed'],'modulePathsPassed':module['passed'],'quest3sTested':False,
            'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          (reports/'release-metadata.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2))
          (reports/'ThreeJS版本检查.json').write_text(json.dumps({'passed':vendor_pkg['version']=='0.180.0','version':vendor_pkg['version'],'source':'Three.js official GitHub tag r180','localVendorPath':'assets/js/vendor/three/','runtimeNetworkDependency':False},ensure_ascii=False,indent=2))
          (reports/'模块路径检查结果.json').write_text(json.dumps(module,ensure_ascii=False,indent=2))
          report=f'''# VR 双人分镜排演台 V2 最终验收报告\n\n## 交付结论\n\n- 项目：VR 双人分镜排演台\n- 版本：2.0.0\n- 正式运行包：`{metadata['runtimeZip']}`\n- 正式 ZIP SHA-256：`{metadata['runtimeSha256']}`\n- 正式 ZIP 大小：{metadata['runtimeBytes']} 字节\n- 正式文件数量：{metadata['fileCount']}\n- JavaScript 文件数量：{metadata['javascriptFileCount']}\n- CSS 文件数量：{metadata['cssFileCount']}\n- 正式运行包已生成：是\n\n## 架构与依赖\n\n- 本项目未使用任何 SDK。\n- 本项目未搜索或依赖 qifu-static-sdk。\n- 没有执行 npm install。\n- 没有访问 npm registry。\n- 没有使用 Vite 构建。\n- 没有新增第三方运行依赖。\n- 开发阶段联网从 Three.js 官方 GitHub 仓库固定标签 `r180` 获取原始文件。\n- Three.js 准确版本：`0.180.0`。\n- Three.js 作为项目本地 vendor 文件随 ZIP 一起交付。\n- 正式运行包完全自包含。\n- 服务器无需预装或注入任何运行库。\n- 所有运行资源均通过相对路径从当前 ZIP 加载。\n- 正式运行时不存在网络请求。\n\n## 测试结果\n\n- TypeScript strict 静态检查：通过。\n- 原生 ES Modules 路径检查：通过。\n- 关键 HTTP 资源检查：通过。\n- TwoBoneIK 与专项逻辑：通过，共 {metadata['specializedAssertions']} 项断言，含 {metadata['ikRandomCases']} 组随机 IK。\n- 普通浏览器动态测试：完成并通过，共 {metadata['browserAssertions']} 项浏览器断言。\n- PNG：实际生成 1024×1024 PNG，并验证文件头和尺寸。\n- 分镜、复制上一镜、切换、残影、摄影机、接触约束、项目 JSON、刷新读取：动态检查通过。\n- Quest 3S 头显真机测试：尚未进行。\n- WebXR、VRButton、控制器射线、扳机拖动、Grip 抓取和安全按钮映射：代码级检查完成。\n\n## 已知限制\n\n- 未进行 Quest 3S 真机交互与帧率验收。\n- V2 面向静态关键姿势和镜头序列，不包含连续骨骼动画时间轴、物理引擎、动作捕捉或视频导出。\n- PNG 不实现真实景深后期效果。\n'''
          (reports/'VR_双人分镜排演台_V2_最终验收报告.md').write_text(report)
          (out/'vr-storyboard-stage-v2.qifuvr.zip.sha256').write_text(metadata['runtimeSha256']+'  vr-storyboard-stage-v2.qifuvr.zip\n')
          (out/'vr-storyboard-stage-v2-source.zip.sha256').write_text(metadata['sourceSha256']+'  vr-storyboard-stage-v2-source.zip\n')
          print(json.dumps(metadata,ensure_ascii=False,indent=2))
          PY
          cp work/validation/*.json work/reports/

      - name: Upload formal packages
        uses: actions/upload-artifact@v4
        with:
          name: vr-storyboard-stage-v2-packages
          path: work/output/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        with:
          name: vr-storyboard-stage-v2-reports
          path: work/reports/*
          if-no-files-found: error
          compression-level: 6
