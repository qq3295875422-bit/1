mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false

proxy-providers:
  japan:
    type: http
    url: "https://freenode.biz/api/featured?format=clash"
    interval: 1800
    path: ./providers/qifu-japan.yaml
    filter: "(?i)(🇯🇵|日本|Japan|Tokyo|JP[-_ ])"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: "🇯🇵 日本自动"
    type: url-test
    use:
      - japan
    url: https://www.gstatic.com/generate_204
    interval: 300

  - name: "🚀 代理"
    type: select
    proxies:
      - "🇯🇵 日本自动"
      - DIRECT

rules:
  - MATCH,🚀 代理
